<article class="profile">
  <div class="profile__vinyl" [class.profile__vinyl--reverse]="true">
    <div class="profile__label">
      @if (user()?.image) {
        <img class="profile__avatar" [src]="user()?.image" alt="" />
      } @else {
        <span aria-hidden="true">?</span>
      }
    </div>
  </div>
  <div class="profile__identity">
    <span class="profile__tag">Last.fm / perfil</span>
    <h2>{{ user()?.username || 'Aguardando usuário' }}</h2>
  </div>
</article>
